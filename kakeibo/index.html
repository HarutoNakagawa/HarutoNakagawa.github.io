<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141209" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<title>家計簿</title>
</head>
<body>
<title>家計簿</title>
<style>
  /* ===== Reset / tokens ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #FBFAF7; --surface: #FFFFFF; --surface-2: #F2EEE6;
    --ink: #1F1B14; --ink-2: #6B6456; --ink-3: #A49C8C;
    --line: #E8E2D6;
    --accent: #CB8A26; --accent-strong: #A86E15; --accent-rgb: 203,138,38;
    --accent-soft: rgba(203,138,38,0.12);
    --sun: #BE4A3D; --sat: #3E6BA0;
    --shadow: 0 1px 2px rgba(31,27,20,.05), 0 8px 24px rgba(31,27,20,.07);
    --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --font-serif: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif JP", ui-serif, Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141209; --surface: #1E1B12; --surface-2: #28231A;
      --ink: #F4EFE3; --ink-2: #B4AB98; --ink-3: #7B735F;
      --line: #322B1E;
      --accent: #F0B542; --accent-strong: #FFCB68; --accent-rgb: 240,181,66;
      --accent-soft: rgba(240,181,66,0.15);
      --sun: #E0786B; --sat: #86ABDA;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"] {
    --bg: #FBFAF7; --surface: #FFFFFF; --surface-2: #F2EEE6;
    --ink: #1F1B14; --ink-2: #6B6456; --ink-3: #A49C8C; --line: #E8E2D6;
    --accent: #CB8A26; --accent-strong: #A86E15; --accent-rgb: 203,138,38;
    --accent-soft: rgba(203,138,38,0.12); --sun: #BE4A3D; --sat: #3E6BA0;
    --shadow: 0 1px 2px rgba(31,27,20,.05), 0 8px 24px rgba(31,27,20,.07);
  }
  :root[data-theme="dark"] {
    --bg: #141209; --surface: #1E1B12; --surface-2: #28231A;
    --ink: #F4EFE3; --ink-2: #B4AB98; --ink-3: #7B735F; --line: #322B1E;
    --accent: #F0B542; --accent-strong: #FFCB68; --accent-rgb: 240,181,66;
    --accent-soft: rgba(240,181,66,0.15); --sun: #E0786B; --sat: #86ABDA;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
  }

  html, body { height: 100%; background: var(--bg); }
  body { font-family: var(--font-ui); color: var(--ink); overscroll-behavior: none; }
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input { font-family: inherit; }
  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  /* ===== App frame ===== */
  .app {
    height: 100dvh; max-width: 460px; margin: 0 auto;
    display: flex; flex-direction: column; position: relative;
    background: var(--bg); overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,.06);
  }
  .screen { flex: 1; position: relative; overflow: hidden; }
  .view {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity .28s ease, transform .28s ease;
  }
  .view.active { opacity: 1; transform: none; pointer-events: auto; }

  /* ===== Input view ===== */
  .view-input { padding: 14px 18px 10px; }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; }
  .topbar .date { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .topbar .today { font-size: 12px; color: var(--ink-2); letter-spacing: .03em; }
  .topbar .today b { color: var(--accent-strong); font-weight: 700; margin-left: 3px; }

  .amount-stage {
    flex: 1; min-height: 76px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
  }
  .amount {
    font-size: clamp(44px, 14vw, 64px); font-weight: 700; letter-spacing: -.02em;
    line-height: 1; display: flex; align-items: baseline; transition: transform .12s ease, color .2s ease;
  }
  .amount .yen { font-size: .5em; font-weight: 600; color: var(--ink-3); margin-right: .12em; transform: translateY(-.04em); }
  .amount.zero { color: var(--ink-3); }
  .amount.pop { transform: scale(1.06); }
  .amount-hint { font-size: 12px; color: var(--ink-3); letter-spacing: .04em; min-height: 15px; }

  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px; flex-shrink: 0; scrollbar-width: none; scroll-snap-type: x proximity; }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip-row { margin: 0 -18px; padding-left: 18px; padding-right: 18px; }
  .chip {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px; border-radius: 999px; background: var(--surface-2);
    color: var(--ink-2); font-size: 14px; font-weight: 600; white-space: nowrap;
    border: 1.5px solid transparent; transition: transform .08s ease, background .15s, color .15s, border-color .15s;
  }
  .chip .em { font-size: 15px; }
  .chip:active { transform: scale(.95); }
  .chip.on { background: var(--accent-soft); color: var(--accent-strong); border-color: rgba(var(--accent-rgb), .5); }
  .row-label { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; color: var(--ink-3); text-transform: uppercase; margin: 10px 2px 6px; flex-shrink: 0; }

  .memo-wrap { flex-shrink: 0; margin-top: 10px; }
  .memo {
    width: 100%; padding: 12px 14px; border-radius: 14px; background: var(--surface-2);
    border: 1.5px solid transparent; color: var(--ink); font-size: 15px; outline: none;
    transition: border-color .15s, background .15s;
  }
  .memo::placeholder { color: var(--ink-3); }
  .memo:focus { border-color: rgba(var(--accent-rgb), .5); background: var(--surface); }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; flex-shrink: 0; }
  .key {
    height: clamp(46px, 7.4vh, 60px); border-radius: 16px; background: var(--surface);
    font-size: 24px; font-weight: 600; color: var(--ink); box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
    transition: transform .07s ease, background .1s ease;
  }
  .key.zero-wide { grid-column: span 1; }
  .key:active { transform: scale(.94); background: var(--accent-soft); }
  .key.back { color: var(--ink-2); font-size: 22px; }
  .key .sub { font-size: 11px; color: var(--ink-3); margin-left: 1px; }

  .save {
    margin-top: 10px; height: clamp(50px, 7vh, 58px); border-radius: 16px; flex-shrink: 0;
    background: var(--accent); color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .04em;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 6px 18px rgba(var(--accent-rgb), .35);
    transition: transform .1s ease, opacity .2s, background .2s;
  }
  :root[data-theme="dark"] .save, .save { color: #2a1d05; }
  @media (prefers-color-scheme: dark) { .save { color: #2a1d05; } }
  .save:active { transform: scale(.98); }
  .save.disabled { opacity: .4; pointer-events: none; box-shadow: none; }
  .save.saving { background: var(--accent-strong); }
  .save .check { display: none; }
  .save.saving .label { display: none; }
  .save.saving .check { display: inline; }

  /* ===== Calendar view ===== */
  .view-cal { padding: 16px 18px 10px; overflow-y: auto; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .cal-nav { width: 38px; height: 38px; border-radius: 12px; font-size: 22px; color: var(--ink-2); display: flex; align-items: center; justify-content: center; }
  .cal-nav:active { background: var(--surface-2); }
  .cal-title { font-family: var(--font-serif); font-size: 19px; font-weight: 600; letter-spacing: .02em; }
  .cal-title small { font-size: 13px; color: var(--ink-3); margin-right: 4px; font-weight: 400; }

  .cal-summary { text-align: center; padding: 14px 0 18px; flex-shrink: 0; }
  .cal-total { font-family: var(--font-serif); font-size: clamp(38px, 12vw, 52px); font-weight: 600; letter-spacing: -.01em; line-height: 1; }
  .cal-total .yen { font-size: .42em; color: var(--ink-3); margin-right: .1em; font-weight: 500; }
  .cal-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 8px; letter-spacing: .02em; }
  .cal-sub .dot { color: var(--ink-3); margin: 0 7px; }

  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 6px; flex-shrink: 0; }
  .weekdays span { text-align: center; font-size: 11px; font-weight: 700; color: var(--ink-3); letter-spacing: .02em; }
  .weekdays span.sun { color: var(--sun); }
  .weekdays span.sat { color: var(--sat); }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; flex-shrink: 0; }
  .cell {
    position: relative; aspect-ratio: 1 / 1.12; border-radius: 11px; background: var(--surface-2);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 6px 2px 3px; overflow: hidden; transition: transform .08s ease;
  }
  .cell.blank { background: transparent; pointer-events: none; }
  .cell:active { transform: scale(.94); }
  .cell .d { font-size: 12.5px; font-weight: 600; color: var(--ink-2); line-height: 1; }
  .cell.sun .d { color: var(--sun); }
  .cell.sat .d { color: var(--sat); }
  .cell .amt { margin-top: auto; font-size: 9.5px; font-weight: 700; color: var(--accent-strong); line-height: 1.1; letter-spacing: -.01em; }
  .cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cell.today .d { color: var(--accent-strong); }

  .breakdown { margin-top: 22px; padding-bottom: 10px; flex-shrink: 0; }
  .bd-title { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 12px; }
  .bd-row { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 10px; margin-bottom: 13px; }
  .bd-em { font-size: 17px; text-align: center; }
  .bd-main { min-width: 0; }
  .bd-name { font-size: 13px; font-weight: 600; margin-bottom: 5px; display: flex; justify-content: space-between; }
  .bd-name .pct { color: var(--ink-3); font-weight: 500; font-size: 11px; }
  .bd-bar { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .bd-bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transform-origin: left; }
  .bd-amt { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; }
  .bd-empty { text-align: center; color: var(--ink-3); font-size: 13px; padding: 40px 0; }

  /* ===== Tab bar ===== */
  .tabbar {
    flex-shrink: 0; display: grid; grid-template-columns: 1fr 1fr;
    border-top: 1px solid var(--line); background: var(--surface);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tab { padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink-3); }
  .tab svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab span { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; }
  .tab.on { color: var(--accent-strong); }

  /* ===== Toast ===== */
  .toast {
    position: absolute; left: 50%; bottom: 84px; transform: translate(-50%, 14px);
    background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; letter-spacing: .02em; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; white-space: nowrap; z-index: 40;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast b { color: var(--accent-strong); margin-left: 4px; }
  @media (prefers-color-scheme: dark) { .toast b { color: var(--accent); } }

  /* ===== Day sheet ===== */
  .backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none;
    transition: opacity .3s ease; z-index: 50;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 60;
    background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 20px 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0));
    transform: translateY(102%); transition: transform .34s cubic-bezier(.22,.9,.3,1);
    max-height: 80%; display: flex; flex-direction: column;
  }
  .sheet.show { transform: translateY(0); }
  .sheet-grab { width: 38px; height: 4px; border-radius: 999px; background: var(--line); margin: 4px auto 14px; }
  .sheet-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; flex-shrink: 0; }
  .sheet-date { font-family: var(--font-serif); font-size: 18px; font-weight: 600; }
  .sheet-total { font-size: 15px; font-weight: 700; }
  .sheet-total .yen { font-size: .7em; color: var(--ink-3); }
  .sheet-list { overflow-y: auto; }
  .entry { display: grid; grid-template-columns: 34px 1fr auto auto; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: none; }
  .entry-em { font-size: 19px; text-align: center; }
  .entry-main { min-width: 0; }
  .entry-cat { font-size: 14.5px; font-weight: 600; }
  .entry-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
  .entry-meta .m-dot { width: 5px; height: 5px; border-radius: 999px; background: var(--ink-3); }
  .entry-amt { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .entry-del { width: 30px; height: 30px; border-radius: 9px; color: var(--ink-3); display: flex; align-items: center; justify-content: center; }
  .entry-del:active { background: var(--surface-2); color: var(--sun); }
  .entry-del svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>

<div class="app">
  <div class="screen">
    <!-- ======== INPUT ======== -->
    <section class="view view-input active" id="viewInput">
      <div class="topbar">
        <div class="date" id="todayDate">—</div>
        <div class="today">今日<b id="todayTotal" class="tnum">¥0</b></div>
      </div>

      <div class="amount-stage">
        <div class="amount zero" id="amountDisp"><span class="yen">¥</span><span class="tnum" id="amountNum">0</span></div>
        <div class="amount-hint" id="amountHint">金額を入力</div>
      </div>

      <div class="chip-row" id="catChips"></div>
      <div class="chip-row" id="methodChips" style="margin-top:8px"></div>

      <div class="memo-wrap">
        <input class="memo" id="memo" type="text" inputmode="text" placeholder="メモ（任意）" autocomplete="off" />
      </div>

      <div class="keypad" id="keypad">
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key" data-k="000">000</button>
        <button class="key" data-k="0">0</button>
        <button class="key back" data-k="back" aria-label="一文字削除">⌫</button>
      </div>

      <button class="save disabled" id="saveBtn">
        <span class="label">記録する</span>
        <span class="check">✓ 記録しました</span>
      </button>
    </section>

    <!-- ======== CALENDAR ======== -->
    <section class="view view-cal" id="viewCal">
      <div class="cal-head">
        <button class="cal-nav" id="prevM" aria-label="前の月">‹</button>
        <div class="cal-title" id="calTitle">—</div>
        <button class="cal-nav" id="nextM" aria-label="次の月">›</button>
      </div>

      <div class="cal-summary">
        <div class="cal-total tnum" id="calTotal"><span class="yen">¥</span>0</div>
        <div class="cal-sub" id="calSub">まだ記録がありません</div>
      </div>

      <div class="weekdays">
        <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>

      <div class="breakdown" id="breakdown"></div>
    </section>
  </div>

  <!-- ======== Tab bar ======== -->
  <nav class="tabbar">
    <button class="tab on" data-view="input" id="tabInput">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg>
      <span>入力</span>
    </button>
    <button class="tab" data-view="cal" id="tabCal">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      <span>カレンダー</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
  <div class="backdrop" id="backdrop"></div>

  <!-- ======== Day sheet ======== -->
  <div class="sheet" id="sheet">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <div class="sheet-date" id="sheetDate">—</div>
      <div class="sheet-total tnum" id="sheetTotal"><span class="yen">¥</span>0</div>
    </div>
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Config ---------- */
  var CATS = [
    { key: "食費", em: "🍚" }, { key: "カフェ", em: "☕️" }, { key: "交通", em: "🚃" },
    { key: "日用品", em: "🧴" }, { key: "買い物", em: "🛍" }, { key: "娯楽", em: "🎬" },
    { key: "交際", em: "🍻" }, { key: "健康", em: "💊" }, { key: "住まい", em: "🏠" },
    { key: "その他", em: "✨" }
  ];
  var METHODS = ["現金", "JALカード", "三井住友カード", "PayPay", "IC", "口座"];
  var WD = ["日", "月", "火", "水", "木", "金", "土"];
  var STORE = "kakeibo.v1";

  /* ---------- State ---------- */
  var amount = 0;
  var cat = CATS[0].key;
  var method = METHODS[0];
  var expenses = [];
  var calCursor = new Date(); calCursor.setDate(1);

  /* ---------- Persistence ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (raw) {
        var d = JSON.parse(raw);
        expenses = Array.isArray(d.expenses) ? d.expenses : [];
        if (d.prefs) {
          if (d.prefs.cat) cat = d.prefs.cat;
          if (d.prefs.method) method = d.prefs.method;
        }
      }
    } catch (e) { expenses = []; }
    if (!CATS.some(function (c) { return c.key === cat; })) cat = CATS[0].key;
    if (METHODS.indexOf(method) < 0) method = METHODS[0];
  }
  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ expenses: expenses, prefs: { cat: cat, method: method } }));
    } catch (e) {}
  }

  /* ---------- Helpers ---------- */
  function yen(n) { return n.toLocaleString("ja-JP"); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function ymd(dt) { return dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate()); }
  function emojiOf(k) { for (var i = 0; i < CATS.length; i++) if (CATS[i].key === k) return CATS[i].em; return "✨"; }
  function el(id) { return document.getElementById(id); }
  function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

  /* ---------- Input: amount display ---------- */
  function renderAmount() {
    var disp = el("amountDisp");
    el("amountNum").textContent = yen(amount);
    disp.classList.toggle("zero", amount === 0);
    el("amountHint").textContent = amount === 0 ? "金額を入力" : (cat + " · " + method);
    var btn = el("saveBtn");
    btn.classList.toggle("disabled", amount === 0);
    disp.classList.remove("pop");
    void disp.offsetWidth;
    disp.classList.add("pop");
  }
  function pressKey(k) {
    if (k === "back") { amount = Math.floor(amount / 10); }
    else if (k === "000") { amount = Math.min(amount * 1000, 9999999); if (amount === 0) {} }
    else { amount = Math.min(amount * 10 + parseInt(k, 10), 9999999); }
    buzz(8);
    renderAmount();
  }

  /* ---------- Input: chips ---------- */
  function buildChips() {
    var c = el("catChips"); c.innerHTML = "";
    CATS.forEach(function (x) {
      var b = document.createElement("button");
      b.className = "chip" + (x.key === cat ? " on" : "");
      b.innerHTML = '<span class="em">' + x.em + '</span>' + x.key;
      b.onclick = function () { cat = x.key; refreshChips(); renderAmount(); save(); };
      c.appendChild(b);
    });
    var m = el("methodChips"); m.innerHTML = "";
    METHODS.forEach(function (x) {
      var b = document.createElement("button");
      b.className = "chip" + (x === method ? " on" : "");
      b.textContent = x;
      b.onclick = function () { method = x; refreshChips(); renderAmount(); save(); };
      m.appendChild(b);
    });
  }
  function refreshChips() {
    var cc = el("catChips").children;
    for (var i = 0; i < cc.length; i++) cc[i].classList.toggle("on", CATS[i].key === cat);
    var mm = el("methodChips").children;
    for (var j = 0; j < mm.length; j++) mm[j].classList.toggle("on", METHODS[j] === method);
  }

  /* ---------- Input: save entry ---------- */
  function addEntry() {
    if (amount === 0) return;
    var now = new Date();
    expenses.push({
      id: now.getTime() + "-" + Math.round(performance.now() * 1000 % 100000),
      date: ymd(now), amount: amount, cat: cat, method: method,
      memo: el("memo").value.trim(), ts: now.getTime()
    });
    save();

    var saved = amount;
    buzz([12, 40, 18]);
    var btn = el("saveBtn");
    btn.classList.add("saving");
    showToast('記録しました<b class="tnum">¥' + yen(saved) + "</b>");

    setTimeout(function () {
      btn.classList.remove("saving");
      amount = 0;
      el("memo").value = "";
      renderAmount();
      renderToday();
    }, 850);
  }

  function renderToday() {
    var t = ymd(new Date());
    var sum = 0;
    expenses.forEach(function (e) { if (e.date === t) sum += e.amount; });
    el("todayTotal").textContent = "¥" + yen(sum);
  }

  function showToast(html) {
    var t = el("toast");
    t.innerHTML = html;
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.classList.remove("show"); }, 1700);
  }

  /* ---------- Calendar ---------- */
  function renderCalendar() {
    var y = calCursor.getFullYear(), mo = calCursor.getMonth();
    el("calTitle").innerHTML = '<small>' + y + '年</small>' + (mo + 1) + '月';

    var map = {}, monthTotal = 0, catTotals = {}, daysWith = {};
    var prefix = y + "-" + pad(mo + 1) + "-";
    expenses.forEach(function (e) {
      if (e.date.indexOf(prefix) === 0) {
        map[e.date] = (map[e.date] || 0) + e.amount;
        monthTotal += e.amount;
        catTotals[e.cat] = (catTotals[e.cat] || 0) + e.amount;
        daysWith[e.date] = true;
      }
    });
    var maxDay = 0;
    for (var k in map) if (map[k] > maxDay) maxDay = map[k];
    var nDays = Object.keys(daysWith).length;

    el("calTotal").innerHTML = '<span class="yen">¥</span>' + yen(monthTotal);
    if (monthTotal === 0) {
      el("calSub").textContent = "まだ記録がありません";
    } else {
      el("calSub").innerHTML = "記録 " + nDays + "日<span class='dot'>·</span>1日平均 ¥" + yen(Math.round(monthTotal / nDays));
    }

    var grid = el("calGrid"); grid.innerHTML = "";
    var first = new Date(y, mo, 1).getDay();
    var total = new Date(y, mo + 1, 0).getDate();
    var todayStr = ymd(new Date());

    for (var b = 0; b < first; b++) {
      var bl = document.createElement("div"); bl.className = "cell blank"; grid.appendChild(bl);
    }
    for (var d = 1; d <= total; d++) {
      var ds = prefix + pad(d);
      var dow = new Date(y, mo, d).getDay();
      var val = map[ds] || 0;
      var cell = document.createElement("button");
      cell.className = "cell" + (dow === 0 ? " sun" : dow === 6 ? " sat" : "") + (ds === todayStr ? " today" : "");
      if (val > 0) {
        var ratio = maxDay ? val / maxDay : 0;
        cell.style.background = "rgba(var(--accent-rgb), " + (0.1 + 0.52 * ratio).toFixed(3) + ")";
      }
      var amtTxt = val > 0 ? '<div class="amt">' + (val >= 10000 ? (Math.round(val / 1000) / 10) + "万" : yen(val)) + '</div>' : "";
      cell.innerHTML = '<div class="d">' + d + '</div>' + amtTxt;
      (function (dstr, hasVal) {
        cell.onclick = function () { if (hasVal) openSheet(dstr); };
      })(ds, val > 0);
      grid.appendChild(cell);
    }

    renderBreakdown(catTotals, monthTotal);
  }

  function renderBreakdown(catTotals, monthTotal) {
    var bd = el("breakdown");
    var arr = [];
    for (var k in catTotals) arr.push({ cat: k, amt: catTotals[k] });
    arr.sort(function (a, b) { return b.amt - a.amt; });

    if (arr.length === 0) {
      bd.innerHTML = '<div class="bd-empty">この月の支出を記録すると、<br>ここに内訳が出ます</div>';
      return;
    }
    var max = arr[0].amt;
    var html = '<div class="bd-title">カテゴリ別</div>';
    arr.forEach(function (x) {
      var pct = Math.round(x.amt / monthTotal * 100);
      html += '<div class="bd-row">' +
        '<div class="bd-em">' + emojiOf(x.cat) + '</div>' +
        '<div class="bd-main">' +
          '<div class="bd-name"><span>' + x.cat + '</span><span class="pct">' + pct + '%</span></div>' +
          '<div class="bd-bar"><i style="width:' + Math.max(4, Math.round(x.amt / max * 100)) + '%"></i></div>' +
        '</div>' +
        '<div class="bd-amt tnum">¥' + yen(x.amt) + '</div>' +
      '</div>';
    });
    bd.innerHTML = html;
  }

  /* ---------- Day sheet ---------- */
  function openSheet(dateStr) {
    var parts = dateStr.split("-");
    var dt = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    el("sheetDate").textContent = (+parts[1]) + "月" + (+parts[2]) + "日 (" + WD[dt.getDay()] + ")";
    renderSheet(dateStr);
    el("backdrop").classList.add("show");
    el("sheet").classList.add("show");
  }
  function closeSheet() {
    el("backdrop").classList.remove("show");
    el("sheet").classList.remove("show");
  }
  function renderSheet(dateStr) {
    var items = expenses.filter(function (e) { return e.date === dateStr; })
      .sort(function (a, b) { return b.ts - a.ts; });
    if (items.length === 0) { closeSheet(); renderCalendar(); return; }
    var sum = 0; items.forEach(function (e) { sum += e.amount; });
    el("sheetTotal").innerHTML = '<span class="yen">¥</span>' + yen(sum);

    var list = el("sheetList"); list.innerHTML = "";
    items.forEach(function (e) {
      var row = document.createElement("div");
      row.className = "entry";
      var meta = e.method + (e.memo ? '<span class="m-dot"></span>' + escapeHtml(e.memo) : "");
      row.innerHTML =
        '<div class="entry-em">' + emojiOf(e.cat) + '</div>' +
        '<div class="entry-main"><div class="entry-cat">' + e.cat + '</div>' +
          '<div class="entry-meta">' + meta + '</div></div>' +
        '<div class="entry-amt tnum">¥' + yen(e.amount) + '</div>' +
        '<button class="entry-del" aria-label="削除"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>';
      row.querySelector(".entry-del").onclick = function () {
        expenses = expenses.filter(function (x) { return x.id !== e.id; });
        save();
        buzz(10);
        renderSheet(dateStr);
        renderToday();
      };
      list.appendChild(row);
    });
  }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  /* ---------- View switching ---------- */
  function switchView(v) {
    var isInput = v === "input";
    el("viewInput").classList.toggle("active", isInput);
    el("viewCal").classList.toggle("active", !isInput);
    el("tabInput").classList.toggle("on", isInput);
    el("tabCal").classList.toggle("on", !isInput);
    if (!isInput) { calCursor = new Date(); calCursor.setDate(1); renderCalendar(); }
    buzz(6);
  }

  /* ---------- Wire up ---------- */
  function init() {
    load();

    var now = new Date();
    el("todayDate").textContent = (now.getMonth() + 1) + "月" + now.getDate() + "日 (" + WD[now.getDay()] + ")";

    buildChips();
    renderAmount();
    renderToday();

    el("keypad").addEventListener("click", function (ev) {
      var btn = ev.target.closest(".key");
      if (btn) pressKey(btn.getAttribute("data-k"));
    });
    el("saveBtn").addEventListener("click", addEntry);

    el("tabInput").onclick = function () { switchView("input"); };
    el("tabCal").onclick = function () { switchView("cal"); };
    el("prevM").onclick = function () { calCursor.setMonth(calCursor.getMonth() - 1); renderCalendar(); };
    el("nextM").onclick = function () { calCursor.setMonth(calCursor.getMonth() + 1); renderCalendar(); };
    el("backdrop").onclick = closeSheet;
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
